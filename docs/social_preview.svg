<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <title>A terminal window of mtorun0x7cd running zsh. The command whoami prints Mert Torun, M.Sc.; cat focus.txt prints Verification of Safety-Critical Systems and Information Security; ls works/ lists working-paper, masters-thesis and bachelors-thesis; a cursor waits at the next prompt. Below the window, two badges read Research &amp; Development and @mtorun0x7cd.</title>
    <defs>
        <!-- Filter for glow effect around the terminal window -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="var(--accent-color)" flood-opacity="var(--glow-opacity)"/>
        </filter>
    </defs>

    <style>
        :root {
            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-badge: #475569;
            --accent-color: #2563EB;
            --badge-border: #cbd5e1;
            --glow-opacity: 0.05;
            --term-bg: #f8fafc;
            --term-bar: #f1f5f9;
            --term-border: #cbd5e1;
            --term-dot: #cbd5e1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-title: #ffffff;
                --text-subtitle: #94a3b8;
                --text-badge: #64748b;
                --accent-color: #60A5FA;
                --badge-border: #334155;
                --glow-opacity: 0.25;
                --term-bg: #0f172a;
                --term-bar: #1e293b;
                --term-border: #334155;
                --term-dot: #475569;
            }
        }
        .term-window {
            fill: var(--term-bg);
            stroke: var(--term-border);
        }
        .term-bar {
            fill: var(--term-bar);
        }
        .term-rule {
            stroke: var(--term-border);
        }
        .term-dot {
            fill: var(--term-dot);
        }
        .term-title {
            fill: var(--text-badge);
        }
        .term-text {
            font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 24px;
        }
        .t-prompt {
            fill: var(--accent-color);
            font-weight: 700;
        }
        .t-cmd {
            fill: var(--text-title);
            font-weight: 600;
        }
        .t-name {
            fill: var(--text-title);
            font-weight: 700;
        }
        .t-out {
            fill: var(--text-subtitle);
            font-weight: 500;
        }
        .t-dir {
            fill: var(--accent-color);
            font-weight: 600;
        }
        .t-cursor {
            fill: var(--accent-color);
            fill-opacity: 0.85;
            animation: cursor-blink 1s steps(1, end) infinite;
        }
        /* A terminal cursor: half a second on, half a second off, no fade */
        @keyframes cursor-blink {
            50% {
                opacity: 0;
            }
        }
        /* Under "reduce motion" the cursor stays, lit and still */
        @media (prefers-reduced-motion: reduce) {
            .t-cursor {
                animation: none;
            }
        }
        .text-badge-dev {
            fill: var(--accent-color);
        }
        .text-badge-gh {
            fill: var(--text-badge);
        }
        .badge-rect-dev {
            fill: var(--accent-color);
            fill-opacity: 0.12;
            stroke: var(--accent-color);
            stroke-opacity: 0.3;
        }
        .badge-rect-gh {
            stroke: var(--badge-border);
        }
    </style>

    <!-- Terminal window: frame, title bar and the three window controls -->
    <g filter="url(#glow)">
        <rect x="150" y="75" width="900" height="414" rx="14" class="term-window" stroke-width="1.5"/>
    </g>
    <path d="M 164 75.75 H 1036 A 13.25 13.25 0 0 1 1049.25 89 V 123 H 150.75 V 89 A 13.25 13.25 0 0 1 164 75.75 Z" class="term-bar"/>
    <line x1="150.75" y1="123" x2="1049.25" y2="123" class="term-rule" stroke-width="1.5"/>
    <circle cx="178" cy="99" r="7" class="term-dot"/>
    <circle cx="202" cy="99" r="7" class="term-dot"/>
    <circle cx="226" cy="99" r="7" class="term-dot"/>
    <text x="600" y="105" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="17" font-weight="600" class="term-title" text-anchor="middle" letter-spacing="0.3">mtorun0x7cd · zsh</text>

    <!-- Session: one text element per terminal line, 40 units apart -->
    <g class="term-text">
        <text x="190" y="171" xml:space="preserve"><tspan class="t-prompt">$</tspan><tspan class="t-cmd"> whoami</tspan></text>
        <text x="190" y="211" xml:space="preserve" class="t-name">Mert Torun, M.Sc.</text>
        <text x="190" y="251" xml:space="preserve"><tspan class="t-prompt">$</tspan><tspan class="t-cmd"> cat focus.txt</tspan></text>
        <text x="190" y="291" xml:space="preserve" class="t-out">Verification of Safety-Critical Systems</text>
        <text x="190" y="331" xml:space="preserve" class="t-out">Information Security</text>
        <text x="190" y="371" xml:space="preserve"><tspan class="t-prompt">$</tspan><tspan class="t-cmd"> ls works/</tspan></text>
        <text x="190" y="411" xml:space="preserve" class="t-dir">working-paper/  masters-thesis/  bachelors-thesis/</text>
        <text x="190" y="451" xml:space="preserve"><tspan class="t-prompt">$</tspan><tspan class="t-cmd"> </tspan></text>
    </g>
    <!-- Block cursor two monospace cells after the last prompt (advance 0.6 em) -->
    <rect x="218.8" y="432" width="14.4" height="25" class="t-cursor"/>

    <!-- Badges, centred below the window -->
    <g transform="translate(600, 519)">
        <!-- Technical Domain Badge (left of centre) -->
        <g transform="translate(-197.5, 0)">
            <rect x="0" y="0" width="220" height="36" rx="8" class="badge-rect-dev" stroke-width="1.5"/>
            <text x="110" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="700" class="text-badge-dev" text-anchor="middle" letter-spacing="1">RESEARCH &amp; DEVELOPMENT</text>
        </g>

        <!-- GitHub Handle Badge (right of centre) -->
        <g transform="translate(37.5, 0)">
            <rect x="0" y="0" width="160" height="36" rx="8" fill="none" class="badge-rect-gh" stroke-width="1.5"/>
            <text x="80" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="700" class="text-badge-gh" text-anchor="middle" letter-spacing="1">@mtorun0x7cd</text>
        </g>
    </g>
</svg>
