<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <title>A zsh session in a terminal window of 56 by 11 characters, at the prompt of the user mtorun0x7cd. whoami prints mtorun0x7cd; git config user.name prints Mert Torun; cat focus.txt prints Verification of Safety-Critical Systems and Information Security; ls works/ lists bachelors-thesis, masters-thesis and working-paper. A cursor rests at the next prompt. Below the window, two labels read Research &amp; Development and @mtorun0x7cd.</title>
    <defs>
        <!-- Filter for glow effect around the terminal window -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="var(--accent-color)" flood-opacity="var(--glow-opacity)"/>
        </filter>
    </defs>

    <style>
        :root {
            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-badge: #475569;
            --accent-color: #2563EB;
            --badge-border: #cbd5e1;
            --glow-opacity: 0.05;
            --term-bg: #f8fafc;
            --term-bar: #f1f5f9;
            --term-border: #cbd5e1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-title: #ffffff;
                --text-subtitle: #94a3b8;
                --text-badge: #64748b;
                --accent-color: #60A5FA;
                --badge-border: #334155;
                --glow-opacity: 0.25;
                --term-bg: #0f172a;
                --term-bar: #1e293b;
                --term-border: #334155;
            }
        }
        .term-window {
            fill: var(--term-bg);
            stroke: var(--term-border);
        }
        .term-bar {
            fill: var(--term-bar);
        }
        .term-rule {
            stroke: var(--term-border);
        }
        .term-title {
            fill: var(--text-badge);
        }
        .term-text {
            font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 24px;
        }
        .t-user {
            fill: var(--accent-color);
            font-weight: 700;
        }
        .t-cmd {
            fill: var(--text-title);
            font-weight: 600;
        }
        .t-out {
            fill: var(--text-subtitle);
            font-weight: 500;
        }
        .t-dir {
            fill: var(--accent-color);
            font-weight: 600;
        }
        .t-cursor {
            fill: var(--accent-color);
            fill-opacity: 0.85;
        }
        .t-cover {
            fill: var(--term-bg);
        }
        .text-badge-dev {
            fill: var(--accent-color);
        }
        .text-badge-gh {
            fill: var(--text-badge);
        }
        .badge-rect-dev {
            fill: var(--accent-color);
            fill-opacity: 0.12;
            stroke: var(--accent-color);
            stroke-opacity: 0.3;
        }
        .badge-rect-gh {
            stroke: var(--badge-border);
        }

        /* The session is typed once, in 4.3 seconds, and then rests; WCAG 2.2
           (2.2.2) asks for a pause control only for motion that lasts longer
           than five seconds. Without animation, in a renderer that has none and
           under "reduce motion", every element shows its final state: the whole
           session with the cursor lit at the last prompt.

           Timeline in seconds. A prompt and the output before it appear at once
           (h1 to h5); its command is typed at 0.05 s a character, after a pause
           of 0.25 s, and the output follows 0.15 s after the last character.
             h1 0.30  prompt 1      k1 0.55 + 0.45  whoami                 6 chars
             h2 1.00  prompt 2      k2 1.25 + 1.15  git config user.name  20 chars
             h3 2.40  prompt 3      k3 2.65 + 0.80  cat focus.txt         13 chars
             h4 3.45  prompt 4      k4 3.70 + 0.60  ls works/              9 chars
             h5 4.30  prompt 5, the cursor rests
           A group hN is hidden until its time. A group kN holds the cursor and a
           cover in the colour of the window, which hides the command; both move
           right by the command's width (characters times 14.4, the 0.6 em
           advance of the monospace font at 24 px) in as many steps, and vanish
           when the output appears. Longhands only: tools/check.sh reads them. */
        .h1, .h2, .h3, .h4, .h5 {
            animation-name: hold;
            animation-timing-function: steps(1, end);
            animation-iteration-count: 1;
        }
        .h1 { animation-duration: 0.3s; }
        .h2 { animation-duration: 1s; }
        .h3 { animation-duration: 2.4s; }
        .h4 { animation-duration: 3.45s; }
        .h5 { animation-duration: 4.3s; }
        .k1, .k2, .k3, .k4 {
            opacity: 0;
            animation-fill-mode: backwards;
            animation-iteration-count: 1;
        }
        .k1 { animation-name: type1; animation-delay: 0.55s; animation-duration: 0.45s; }
        .k2 { animation-name: type2; animation-delay: 1.25s; animation-duration: 1.15s; }
        .k3 { animation-name: type3; animation-delay: 2.65s; animation-duration: 0.8s; }
        .k4 { animation-name: type4; animation-delay: 3.7s; animation-duration: 0.6s; }
        @keyframes hold {
            from, to { opacity: 0; }
        }
        @keyframes type1 {
            0% { opacity: 1; transform: translateX(0px); animation-timing-function: steps(6, end); }
            66.667% { opacity: 1; transform: translateX(86.4px); }
            100% { opacity: 1; transform: translateX(86.4px); }
        }
        @keyframes type2 {
            0% { opacity: 1; transform: translateX(0px); animation-timing-function: steps(20, end); }
            86.957% { opacity: 1; transform: translateX(288px); }
            100% { opacity: 1; transform: translateX(288px); }
        }
        @keyframes type3 {
            0% { opacity: 1; transform: translateX(0px); animation-timing-function: steps(13, end); }
            81.25% { opacity: 1; transform: translateX(187.2px); }
            100% { opacity: 1; transform: translateX(187.2px); }
        }
        @keyframes type4 {
            0% { opacity: 1; transform: translateX(0px); animation-timing-function: steps(9, end); }
            75% { opacity: 1; transform: translateX(129.6px); }
            100% { opacity: 1; transform: translateX(129.6px); }
        }
        /* Under "reduce motion" nothing moves: every element is in its final state */
        @media (prefers-reduced-motion: reduce) {
            .h1, .h2, .h3, .h4, .h5, .k1, .k2, .k3, .k4 {
                animation: none;
            }
        }
    </style>

    <!-- Terminal window: frame, title bar and the three window controls in their system colours -->
    <g filter="url(#glow)">
        <rect x="165" y="60" width="870" height="446" rx="14" class="term-window" stroke-width="1.5"/>
    </g>
    <path d="M 179 60.75 H 1021 A 13.25 13.25 0 0 1 1034.25 74 V 108 H 165.75 V 74 A 13.25 13.25 0 0 1 179 60.75 Z" class="term-bar"/>
    <line x1="165.75" y1="108" x2="1034.25" y2="108" class="term-rule" stroke-width="1.5"/>
    <circle cx="193" cy="84" r="7" fill="#FF5F57" stroke="#E0443E" stroke-width="0.75"/>
    <circle cx="217" cy="84" r="7" fill="#FEBC2E" stroke="#DEA123" stroke-width="0.75"/>
    <circle cx="241" cy="84" r="7" fill="#28C840" stroke="#1AAB29" stroke-width="0.75"/>
    <text x="600" y="90" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="17" font-weight="600" class="term-title" text-anchor="middle" letter-spacing="0.3">mtorun0x7cd · zsh · 56×11</text>

    <!-- Session: one text element per terminal line, 34 units apart; the prompt is
         PROMPT='%n %1~ %# ' of zsh, 16 cells wide, so each command starts at x 427.4 -->
    <g class="term-text">
        <g class="h1">
            <text x="197" y="144" xml:space="preserve"><tspan class="t-user">mtorun0x7cd</tspan><tspan class="t-out"> ~</tspan><tspan class="t-cmd"> % whoami</tspan></text>
            <g class="k1">
                <rect x="427.4" y="120" width="104" height="32" class="t-cover"/>
                <rect x="427.4" y="125" width="14.4" height="25" class="t-cursor"/>
            </g>
        </g>
        <g class="h2">
            <text x="197" y="178" xml:space="preserve" class="t-out">mtorun0x7cd</text>
            <text x="197" y="212" xml:space="preserve"><tspan class="t-user">mtorun0x7cd</tspan><tspan class="t-out"> ~</tspan><tspan class="t-cmd"> % git config user.name</tspan></text>
            <g class="k2">
                <rect x="427.4" y="188" width="305.6" height="32" class="t-cover"/>
                <rect x="427.4" y="193" width="14.4" height="25" class="t-cursor"/>
            </g>
        </g>
        <g class="h3">
            <text x="197" y="246" xml:space="preserve" class="t-out">Mert Torun</text>
            <text x="197" y="280" xml:space="preserve"><tspan class="t-user">mtorun0x7cd</tspan><tspan class="t-out"> ~</tspan><tspan class="t-cmd"> % cat focus.txt</tspan></text>
            <g class="k3">
                <rect x="427.4" y="256" width="204.8" height="32" class="t-cover"/>
                <rect x="427.4" y="261" width="14.4" height="25" class="t-cursor"/>
            </g>
        </g>
        <g class="h4">
            <text x="197" y="314" xml:space="preserve" class="t-out">Verification of Safety-Critical Systems</text>
            <text x="197" y="348" xml:space="preserve" class="t-out">Information Security</text>
            <text x="197" y="382" xml:space="preserve"><tspan class="t-user">mtorun0x7cd</tspan><tspan class="t-out"> ~</tspan><tspan class="t-cmd"> % ls works/</tspan></text>
            <g class="k4">
                <rect x="427.4" y="358" width="147.2" height="32" class="t-cover"/>
                <rect x="427.4" y="363" width="14.4" height="25" class="t-cursor"/>
            </g>
        </g>
        <g class="h5">
            <!-- ls prints two columns in 56 columns: the first is 24 cells wide, the next tab stop -->
            <text x="197" y="416" xml:space="preserve" class="t-dir">bachelors-thesis        working-paper</text>
            <text x="197" y="450" xml:space="preserve" class="t-dir">masters-thesis</text>
            <text x="197" y="484" xml:space="preserve"><tspan class="t-user">mtorun0x7cd</tspan><tspan class="t-out"> ~</tspan><tspan class="t-cmd"> % </tspan></text>
            <rect x="427.4" y="465" width="14.4" height="25" class="t-cursor"/>
        </g>
    </g>

    <!-- Labels, centred below the window -->
    <g transform="translate(600, 534)">
        <g transform="translate(-197.5, 0)">
            <rect x="0" y="0" width="220" height="36" rx="8" class="badge-rect-dev" stroke-width="1.5"/>
            <text x="110" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="700" class="text-badge-dev" text-anchor="middle" letter-spacing="1">RESEARCH &amp; DEVELOPMENT</text>
        </g>
        <g transform="translate(37.5, 0)">
            <rect x="0" y="0" width="160" height="36" rx="8" fill="none" class="badge-rect-gh" stroke-width="1.5"/>
            <text x="80" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="700" class="text-badge-gh" text-anchor="middle" letter-spacing="1">@mtorun0x7cd</text>
        </g>
    </g>
</svg>
